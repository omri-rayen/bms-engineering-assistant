# dead_code.yaml -- structural coverage gates.
#
# Per ISO 26262-6:2018 Table 12 ("Structural coverage metrics at the
# software unit level") the standard "highly recommends" decision
# coverage for ASIL B/C/D and MC/DC for ASIL D. We therefore gate each
# component against the per-ASIL `policy.limits.<mdl>` budget; the
# policy file is the single place to tune what counts as "acceptable
# residual gap". Per-block forensics are produced by Simulink Coverage
# itself -- the analyzer does not duplicate that listing because the
# COV.json export only contains aggregates.
#
# Standard refs used here are limited to clauses we actually consult.
# We intentionally do NOT cite ISO 26262-8 (tool qualification) for
# modelling-style topics.

rules:

  # ============= ASIL D : bms_master =================================
  - id: COV-MASTER-EXEC
    category: dead_code
    when: coverage.bms_master.execution.dead_pct > policy.limits.bms_master.exec
    bind:
      value: coverage.bms_master.execution.dead_pct
      limit: policy.limits.bms_master.exec
    severity: critical
    finding: "bms_master execution coverage gap = {value:.2f}% (ASIL D, limit {limit:.0f}%)"
    reasoning: >
      Statement coverage at the model level is the easiest metric to
      close; any gap on an ASIL-D component means at least one block is
      structurally unreachable from the MIL stimulus -- either dead code
      to delete or a missing test case.
    recommend:
      - "Open Simulink Coverage > Coverage Report and sort blocks by
         execution; the unhit ones are the offenders."
      - "Either delete unreachable blocks, or add a MIL test that drives
         them and re-run mil.run."
    refs: ["ISO 26262-6:2018 Table 12 (statement coverage, ASIL D = ++)"]

  - id: COV-MASTER-DEC
    category: dead_code
    when: coverage.bms_master.decision.dead_pct > policy.limits.bms_master.dec
    bind:
      value: coverage.bms_master.decision.dead_pct
      limit: policy.limits.bms_master.dec
    severity: critical
    finding: "bms_master decision coverage gap = {value:.2f}% (ASIL D, limit {limit:.0f}%)"
    reasoning: >
      Decision coverage is highly recommended for ASIL D. A non-zero gap
      means at least one if/Switch/relational has only been exercised
      in one direction by MIL.
    recommend:
      - "Coverage Report > Decision metric: each '<100%' decision lists
         which outcome (true/false) is missing."
      - "Add the missing-direction stimulus to MIL, or filter the
         decision with a §9.4.5 rationale (typically a defensive branch
         that cannot occur on the integration target)."
    refs: ["ISO 26262-6:2018 Table 12 (branch coverage, ASIL D = ++)"]

  - id: COV-MASTER-COND
    category: dead_code
    when: coverage.bms_master.condition.dead_pct > policy.limits.bms_master.cond
    bind:
      value: coverage.bms_master.condition.dead_pct
      limit: policy.limits.bms_master.cond
    severity: major
    finding: "bms_master condition coverage gap = {value:.2f}% (ASIL D, limit {limit:.0f}%)"
    reasoning: >
      Condition coverage is the per-operand cousin of decision coverage:
      every Boolean sub-expression must take both true and false values.
      Gaps usually indicate dead operands inside compound predicates.
    recommend:
      - "Inspect the AND/OR fan-in of the failing predicate; reorder or
         simplify when one operand is provably invariant."

  - id: COV-MASTER-MCDC
    category: dead_code
    when: coverage.bms_master.mcdc.dead_pct > policy.limits.bms_master.mcdc
    bind:
      value: coverage.bms_master.mcdc.dead_pct
      limit: policy.limits.bms_master.mcdc
    severity: major
    finding: "bms_master MC/DC coverage gap = {value:.2f}% (ASIL D, limit {limit:.0f}%)"
    reasoning: >
      MC/DC is highly recommended for ASIL D. Each independent operand
      of every decision must demonstrate that it can flip the outcome
      on its own. Achieving 100% on legacy logic is rarely practical;
      ISO 26262-6 §9.4.5 explicitly allows incomplete coverage if the
      gap is justified -- this rule fires above {limit:.0f}% so the
      remaining cases get a written rationale rather than silently
      ignored.
    recommend:
      - "For each uncovered MC/DC pair, decide between (a) adding a
         driving stimulus, (b) refactoring the predicate to remove
         masked operands, or (c) accepting the gap with a §9.4.5
         justification recorded in the safety case."
    refs: ["ISO 26262-6:2018 Table 12 (MC/DC, ASIL D = ++)",
           "ISO 26262-6:2018 §9.4.5"]

  # ============= ASIL C : bms_slave ==================================
  - id: COV-SLAVE-EXEC
    category: dead_code
    when: coverage.bms_slave.execution.dead_pct > policy.limits.bms_slave.exec
    bind:
      value: coverage.bms_slave.execution.dead_pct
      limit: policy.limits.bms_slave.exec
    severity: major
    finding: "bms_slave execution coverage gap = {value:.2f}% (ASIL C, limit {limit:.0f}%)"
    reasoning: >
      ASIL C still requires statement coverage to be closed; the gap
      points to dead code in the cell-level acquisition pipeline.
    recommend:
      - "Open Coverage Report on bms_slave and remove or cover the
         unhit blocks."
    refs: ["ISO 26262-6:2018 Table 12 (statement coverage, ASIL C = ++)"]

  - id: COV-SLAVE-DEC
    category: dead_code
    when: coverage.bms_slave.decision.dead_pct > policy.limits.bms_slave.dec
    bind:
      value: coverage.bms_slave.decision.dead_pct
      limit: policy.limits.bms_slave.dec
    severity: major
    finding: "bms_slave decision coverage gap = {value:.2f}% (ASIL C, limit {limit:.0f}%)"
    reasoning: >
      Branch coverage is highly recommended for ASIL C. The bms_slave
      MIL stimulus does not exercise both directions of every decision.
    recommend:
      - "Identify the failing decisions in the Coverage Report and add
         driving stimulus, or justify with §9.4.5."
    refs: ["ISO 26262-6:2018 Table 12 (branch coverage, ASIL C = ++)"]

  # ============= QM : fault_predictor ================================
  - id: COV-PREDICTOR-EXEC
    category: dead_code
    when: coverage.fault_predictor.execution.dead_pct > policy.limits.fault_predictor.exec
    bind:
      value: coverage.fault_predictor.execution.dead_pct
      limit: policy.limits.fault_predictor.exec
    severity: minor
    finding: "fault_predictor execution gap = {value:.2f}% (QM, limit {limit:.0f}%)"
    reasoning: >
      QM does not mandate any structural metric, but persistent
      unreachable blocks usually mean leftover scaffolding that should
      be removed before code generation to keep the predictor lean.
    recommend:
      - "Delete unused blocks under fault_predictor/Predict, or add a
         representative inference stimulus to the QM test bench."

  - id: COV-PREDICTOR-COND
    category: dead_code
    when: coverage.fault_predictor.condition.dead_pct > policy.limits.fault_predictor.cond
    bind:
      value: coverage.fault_predictor.condition.dead_pct
      limit: policy.limits.fault_predictor.cond
    severity: info
    finding: "fault_predictor condition gap = {value:.2f}% (QM, limit {limit:.0f}%)"
    reasoning: >
      Acceptable for a QM component, recorded for visibility only.
